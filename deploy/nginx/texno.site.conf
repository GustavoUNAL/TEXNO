# TEXNO — texno.site
# Proxy reverso → Node (PM2) en 127.0.0.1:3847
#
# Instalación en Ubuntu:
#   sudo bash deploy/setup-texno-site.sh
#
# Requisito DNS:
#   texno.site      A  → IP del VPS
#   www.texno.site  A  → IP del VPS  (o CNAME a texno.site)

# HTTP → HTTPS + challenge Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name texno.site www.texno.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://texno.site$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.texno.site;

    ssl_certificate     /etc/letsencrypt/live/texno.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/texno.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://texno.site$request_uri;
}

# TEXNO (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name texno.site;

    ssl_certificate     /etc/letsencrypt/live/texno.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/texno.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Subidas de audio hasta 80 MB (igual que multer en server.js)
    client_max_body_size 80M;

    access_log /var/log/nginx/texno.site.access.log;
    error_log  /var/log/nginx/texno.site.error.log;

    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Análisis de audio puede tardar
        proxy_buffering off;
    }
}
